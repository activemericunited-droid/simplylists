<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>simplylists</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23F0A06A' d='M16 2c2.5 6 4 7.5 10 10-6 2.5-7.5 4-10 10-2.5-6-4-7.5-10-10 6-2.5 7.5-4 10-10z'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --cat-blue: #1348FB;
      --logo-peach: #F0A06A;
      --post-green: #1BF40B;
      --bg: #ffffff;
      --surface: #f7f8fa;
      --border: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --danger: #dc2626;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a {
      color: var(--cat-blue);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .logo-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      padding: 0;
      text-decoration: none;
    }

    .logo-icon {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
    }

    /* Tightened logo title with zero extra spacing between letters */
    .logo-title {
      font-family: 'Inter', sans-serif;
      font-size: clamp(1.5rem, 4vw, 1.85rem);
      font-weight: 800;
      color: var(--logo-peach);
      letter-spacing: -0.055em;
      word-spacing: 0;
      font-kerning: normal;
      line-height: 1;
      display: inline-block;
    }

    .search-bar {
      flex: 1 1 260px;
      max-width: 420px;
      display: flex;
      gap: 6px;
    }

    .search-bar input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.92rem;
      font-family: inherit;
      outline: none;
    }

    .search-bar input:focus {
      border-color: var(--cat-blue);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 600;
      transition: opacity 0.15s, background 0.15s;
    }

    .btn:hover {
      background: var(--surface);
    }

    .btn-post {
      background: var(--post-green);
      color: #052e02;
      border-color: transparent;
      font-weight: 700;
    }

    .btn-post:hover {
      background: #17d909;
    }

    .btn-primary {
      background: var(--cat-blue);
      color: #fff;
      border-color: transparent;
    }

    .btn-primary:hover {
      opacity: 0.92;
      background: var(--cat-blue);
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
      border-color: transparent;
    }

    /* Main Container */
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 20px 16px 48px;
    }

    /* Featured Weekly Photo Carousel */
    .featured-section {
      margin-bottom: 24px;
    }

    .section-label {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .carousel-track {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }

    .carousel-card {
      flex: 0 0 210px;
      scroll-snap-align: start;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: #fff;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .carousel-card:hover {
      transform: translateY(-2px);
    }

    .carousel-card img {
      width: 100%;
      height: 125px;
      object-fit: cover;
      display: block;
      background: var(--surface);
    }

    .carousel-card-body {
      padding: 8px 10px;
    }

    .carousel-card-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .carousel-card-price {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--cat-blue);
      margin-top: 3px;
    }

    /* Categories Directory */
    .categories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
      gap: 18px;
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 28px;
    }

    .category-group h3.category-heading {
      color: var(--cat-blue);
      font-size: clamp(0.98rem, 3.2vw, 1.08rem);
      font-weight: 700;
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      word-break: break-word;
    }

    .subcategory-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .subcategory-list button {
      background: none;
      border: none;
      padding: 2px 0;
      text-align: left;
      font-size: 0.88rem;
      color: var(--text);
      width: 100%;
      word-break: break-word;
    }

    .subcategory-list button:hover,
    .subcategory-list button.active {
      color: var(--cat-blue);
      font-weight: 600;
      text-decoration: underline;
    }

    /* Active Listings Feed & Smartphone-Optimized Headings */
    .listings-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .listings-toolbar h2 {
      font-size: clamp(1.05rem, 4vw, 1.3rem);
      color: var(--cat-blue);
      font-weight: 700;
      word-break: break-word;
    }

    .listings-list {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: #fff;
    }

    .listing-row {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      transition: background 0.12s;
    }

    .listing-row:last-child {
      border-bottom: none;
    }

    .listing-row:hover {
      background: var(--surface);
    }

    .listing-thumb {
      width: 76px;
      height: 58px;
      border-radius: 6px;
      object-fit: cover;
      background: var(--surface);
      cursor: pointer;
    }

    .listing-content {
      min-width: 0; /* Critical so flex/grid children shrink on mobile */
      cursor: pointer;
    }

    .listing-heading {
      font-size: clamp(0.95rem, 3.8vw, 1.06rem);
      font-weight: 600;
      line-height: 1.3;
      color: var(--cat-blue);
      margin-bottom: 4px;
      overflow-wrap: anywhere;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .listing-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 10px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .listing-price {
      font-weight: 700;
      color: var(--text);
    }

    .listing-badge {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 0.74rem;
      white-space: nowrap;
    }

    .fav-btn {
      background: none;
      border: none;
      font-size: 1.25rem;
      line-height: 1;
      color: #9ca3af;
      padding: 6px;
      border-radius: 6px;
    }

    .fav-btn.active {
      color: #ef4444;
    }

    .empty-state {
      padding: 36px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.94rem;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 20px 16px;
      margin-top: 24px;
    }

    .footer-inner {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .footer-links button {
      background: none;
      border: none;
      color: var(--cat-blue);
      font-size: 0.85rem;
      padding: 0;
    }

    .footer-links button:hover {
      text-decoration: underline;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: #fff;
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.18);
    }

    .modal.modal-wide {
      max-width: 820px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h3 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      overflow-wrap: anywhere;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.4rem;
      line-height: 1;
      color: var(--muted);
      padding: 2px 6px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.84rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.92rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .status-msg {
      font-size: 0.86rem;
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      display: none;
    }

    .status-msg.error {
      display: block;
      background: #fef2f2;
      color: var(--danger);
      border: 1px solid #fecaca;
    }

    .status-msg.success {
      display: block;
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    /* Admin Tabs */
    .admin-tabs {
      display: flex;
      gap: 6px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
      overflow-x: auto;
    }

    .admin-tab {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 8px 12px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
    }

    .admin-tab.active {
      color: var(--cat-blue);
      border-bottom-color: var(--cat-blue);
    }

    .admin-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .detail-photo {
      width: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 12px;
      background: var(--surface);
    }

    /* Smartphone Breakpoint */
    @media (max-width: 640px) {
      .header-inner {
        padding: 10px 12px;
        gap: 8px;
      }

      .search-bar {
        order: 3;
        flex: 1 1 100%;
        max-width: 100%;
      }

      .header-actions {
        gap: 6px;
      }

      .btn {
        padding: 7px 10px;
        font-size: 0.82rem;
      }

      main {
        padding: 14px 12px 36px;
      }

      .categories-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        padding: 12px;
      }

      .listing-row {
        grid-template-columns: 60px minmax(0, 1fr) auto;
        gap: 10px;
        padding: 10px;
        align-items: start;
      }

      .listing-thumb {
        width: 60px;
        height: 48px;
      }

      .listing-heading {
        font-size: 0.92rem;
        line-height: 1.28;
      }

      .listing-meta {
        font-size: 0.76rem;
        gap: 4px 8px;
      }

      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-inner">
      <button class="logo-btn" id="homeResetBtn" aria-label="simplylists home">
        <svg class="logo-icon" viewBox="0 0 32 32" aria-hidden="true">
          <path fill="#F0A06A" d="M16 2c2.5 6 4 7.5 10 10-6 2.5-7.5 4-10 10-2.5-6-4-7.5-10-10 6-2.5 7.5-4 10-10z"/>
        </svg>
        <span class="logo-title">simplylists</span>
      </button>

      <form class="search-bar" id="searchForm">
        <input type="search" id="searchInput" placeholder="Search simplylists..." />
        <button type="submit" class="btn">Search</button>
      </form>

      <div class="header-actions">
        <button class="btn btn-post" id="openPostModalBtn">+ post</button>
        <button class="btn" id="toggleFavsBtn" title="Saved Favorites">♡</button>
        <button class="btn" id="openInboxBtn" style="display:none;">Messages</button>
        <button class="btn" id="openAdminBtn" style="display:none;">Admin</button>
        <button class="btn" id="openAuthBtn">Log in</button>
      </div>
    </div>
  </header>

  <main>
    <!-- Weekly Top-Clicked Photo Featured Carousel -->
    <section class="featured-section" id="featuredSection" style="display:none;">
      <div class="section-label">
        <span>Featured Listings</span>
      </div>
      <div class="carousel-track" id="featuredCarousel"></div>
    </section>

    <!-- Category Directory -->
    <section class="categories-grid" id="categoriesGrid"></section>

    <!-- Active Listings Feed -->
    <section>
      <div class="listings-toolbar">
        <h2 id="feedHeading">All Recent Listings</h2>
        <button class="btn" id="clearFiltersBtn" style="display:none;">Clear filter</button>
      </div>
      <div class="listings-list" id="listingsContainer">
        <div class="empty-state">Loading listings...</div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-inner">
      <span>© <span id="yearSpan"></span> simplylists.org</span>
      <div class="footer-links">
        <button data-info="terms">terms of use</button>
        <button data-info="privacy">privacy</button>
        <button data-info="contact">contact</button>
        <button data-info="scam">scam &amp; fraud</button>
        <button id="openFeedbackBtn">feedback</button>
      </div>
    </div>
  </footer>

  <!-- Auth & Password Reset Modal -->
  <div class="modal-backdrop" id="authModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="authModalTitle">Log in to simplylists</h3>
        <button class="modal-close" data-close="authModal">&times;</button>
      </div>

      <!-- Standard Sign In / Sign Up Form -->
      <form id="authForm">
        <div class="form-group">
          <label for="authEmail">Email</label>
          <input type="email" id="authEmail" required />
        </div>
        <div class="form-group" id="authPasswordGroup">
          <label for="authPassword">Password</label>
          <input type="password" id="authPassword" minlength="6" required />
        </div>
        <button type="submit" class="btn btn-primary" id="authSubmitBtn" style="width:100%;">Log in</button>
        <div style="display:flex; justify-content:space-between; margin-top:10px; font-size:0.84rem;">
          <button type="button" id="toggleAuthModeBtn" style="background:none;border:none;color:var(--cat-blue);">Need an account? Sign up</button>
          <button type="button" id="forgotPasswordBtn" style="background:none;border:none;color:var(--muted);">Forgot password?</button>
        </div>
        <div class="status-msg" id="authStatus"></div>
      </form>

      <!-- Password Recovery Update Form (Shown on PASSWORD_RECOVERY redirect) -->
      <form id="resetPasswordForm" style="display:none;">
        <div class="form-group">
          <label for="newPasswordInput">New Password</label>
          <input type="password" id="newPasswordInput" minlength="6" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Update Password</button>
        <div class="status-msg" id="resetStatus"></div>
      </form>
    </div>
  </div>

  <!-- Create Post Modal -->
  <div class="modal-backdrop" id="postModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Create a Listing</h3>
        <button class="modal-close" data-close="postModal">&times;</button>
      </div>
      <form id="createPostForm">
        <div class="form-group">
          <label for="postTitle">Title</label>
          <input type="text" id="postTitle" maxlength="110" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="postCategory">Category &amp; Subcategory</label>
            <select id="postCategory" required></select>
          </div>
          <div class="form-group">
            <label for="postPrice">Price ($)</label>
            <input type="number" id="postPrice" min="0" step="1" placeholder="Optional" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="postLocation">Location / Neighborhood</label>
            <input type="text" id="postLocation" placeholder="e.g., Westminster, CA" required />
          </div>
          <div class="form-group">
            <label for="postDuration">Listing Expiration</label>
            <select id="postDuration">
              <option value="7">7 days</option>
              <option value="14">14 days</option>
              <option value="30" selected>30 days</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="postPhoto">Photo Upload (Optional)</label>
          <input type="file" id="postPhoto" accept="image/*" />
        </div>
        <div class="form-group">
          <label for="postDescription">Description</label>
          <textarea id="postDescription" rows="4" required></textarea>
        </div>
        <button type="submit" class="btn btn-post" style="width:100%;">Publish Listing</button>
        <div class="status-msg" id="postStatus"></div>
      </form>
    </div>
  </div>

  <!-- Listing Detail & In-Site Messaging Modal -->
  <div class="modal-backdrop" id="detailModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="detailTitle"></h3>
        <button class="modal-close" data-close="detailModal">&times;</button>
      </div>
      <img id="detailPhoto" class="detail-photo" style="display:none;" alt="Listing photo" />
      <div class="listing-meta" id="detailMeta" style="margin-bottom:12px;"></div>
      <p id="detailDescription" style="white-space:pre-wrap; margin-bottom:16px; font-size:0.94rem;"></p>

      <div style="border-top:1px solid var(--border); padding-top:14px;">
        <h4 style="font-size:0.94rem; margin-bottom:8px;">Message Poster</h4>
        <form id="messageForm">
          <div class="form-group">
            <textarea id="messageContent" rows="3" placeholder="Write your message..." required></textarea>
          </div>
          <div style="display:flex; justify-content:space-between; gap:8px;">
            <button type="submit" class="btn btn-primary">Send Message</button>
            <button type="button" class="btn" id="flagListingBtn" style="color:var(--danger);">Flag Listing</button>
          </div>
          <div class="status-msg" id="messageStatus"></div>
        </form>
      </div>
    </div>
  </div>

  <!-- Inbox Modal -->
  <div class="modal-backdrop" id="inboxModal">
    <div class="modal modal-wide">
      <div class="modal-header">
        <h3>In-Site Messages</h3>
        <button class="modal-close" data-close="inboxModal">&times;</button>
      </div>
      <div id="inboxList"></div>
    </div>
  </div>

  <!-- Feedback Modal -->
  <div class="modal-backdrop" id="feedbackModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Submit Feedback</h3>
        <button class="modal-close" data-close="feedbackModal">&times;</button>
      </div>
      <form id="feedbackForm">
        <div class="form-group">
          <label for="feedbackEmail">Your Email</label>
          <input type="email" id="feedbackEmail" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="feedbackMessage">Message</label>
          <textarea id="feedbackMessage" rows="4" placeholder="Share a bug report, feature idea, or question..." required></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Send Feedback</button>
        <div class="status-msg" id="feedbackStatus"></div>
      </form>
    </div>
  </div>

  <!-- 4-Tab Admin Moderation Center Modal -->
  <div class="modal-backdrop" id="adminModal">
    <div class="modal modal-wide">
      <div class="modal-header">
        <h3>Admin Moderation Center</h3>
        <button class="modal-close" data-close="adminModal">&times;</button>
      </div>
      <div class="admin-tabs">
        <button class="admin-tab active" data-admin-tab="listings">Listings</button>
        <button class="admin-tab" data-admin-tab="flagged">Flagged</button>
        <button class="admin-tab" data-admin-tab="messages">Messages</button>
        <button class="admin-tab" data-admin-tab="feedback">User Feedback</button>
      </div>
      <div id="adminContent"></div>
    </div>
  </div>

  <!-- Footer Info Modal -->
  <div class="modal-backdrop" id="infoModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="infoModalTitle"></h3>
        <button class="modal-close" data-close="infoModal">&times;</button>
      </div>
      <div id="infoModalBody" style="font-size:0.92rem; color:var(--text);"></div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. SUPABASE CONFIGURATION
    // ==========================================
    const SUPABASE_URL = "https://xqpinjcstaqdbtczgykp.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_Vq3EYb717vMAHomU5U0k3A_ibTfyNAb";
    const ADMIN_EMAILS = ["admin@simplylists.org"]; // Replace with your admin email(s)
    const PHOTO_BUCKET = "listing-photos";

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ==========================================
    // 2. CATEGORIES & SUBCATEGORIES
    // ==========================================
    const CATEGORIES = {
      community: ["activities", "artists", "events", "general", "groups", "local news", "lost & found", "volunteers"],
      services: ["automotive", "beauty", "computer", "creative", "household", "labor & move", "lessons", "skilled trade"],
      housing: ["apts / housing", "rooms & shares", "sublets / temporary", "parking & storage", "vacation rentals"],
      "for sale": ["appliances", "auto parts", "bikes", "cars & trucks", "electronics", "furniture", "free", "general"],
      jobs: ["admin / office", "customer service", "food / bev / hosp", "general labor", "healthcare", "software / tech"],
      gigs: ["computer", "creative", "crew", "domestic", "event", "labor", "talent", "writing"],
      personals: [
        "strictly platonic",
        "women seek women",
        "women seeking men",
        "men seeking women",
        "men seeking men",
        "misc romance",
        "casual encounters"
      ]
    };

    const FOOTER_CONTENT = {
      terms: {
        title: "Terms of Use",
        body: "By using simplylists.org, you agree to post accurate, lawful listings and respect other community members. Prohibited, fraudulent, or abusive content will be removed immediately."
      },
      privacy: {
        title: "Privacy Policy",
        body: "We collect only the account and listing data required to operate simplylists.org. Your email address is never sold to third parties."
      },
      contact: {
        title: "Contact",
        body: "Questions or support inquiries? Reach us at contact@simplylists.org or use the Feedback link in the footer."
      },
      scam: {
        title: "Scam & Fraud Prevention",
        body: "Meet locally in public places, inspect items before paying, and never wire funds or send gift cards to strangers. Use the Flag Listing button to alert moderation."
      }
    };

    // ==========================================
    // 3. STATE
    // ==========================================
    let currentUser = null;
    let allListings = [];
    let favoriteIds = new Set(JSON.parse(localStorage.getItem("sl_favs") || "[]"));
    let activeCategory = null;
    let activeSubcategory = null;
    let showFavsOnly = false;
    let searchQuery = "";
    let activeListing = null;
    let authMode = "login"; // 'login' | 'signup'

    // ==========================================
    // 4. INITIALIZATION
    // ==========================================
    document.getElementById("yearSpan").textContent = new Date().getFullYear();

    function openModal(id) {
      document.getElementById(id).classList.add("open");
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("open");
    }

    function setStatus(elId, msg, type) {
      const el = document.getElementById(elId);
      el.textContent = msg;
      el.className = `status-msg ${type}`;
    }

    function clearStatus(elId) {
      const el = document.getElementById(elId);
      el.textContent = "";
      el.className = "status-msg";
    }

    function escapeHtml(str = "") {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Modal close buttons & backdrop clicks
    document.querySelectorAll(".modal-close").forEach((btn) => {
      btn.addEventListener("click", () => closeModal(btn.dataset.close));
    });
    document.querySelectorAll(".modal-backdrop").forEach((backdrop) => {
      backdrop.addEventListener("click", (e) => {
        if (e.target === backdrop) backdrop.classList.remove("open");
      });
    });

    // ==========================================
    // 5. RENDER CATEGORIES & DROPDOWN
    // ==========================================
    function renderCategories() {
      const grid = document.getElementById("categoriesGrid");
      const select = document.getElementById("postCategory");
      grid.innerHTML = "";
      select.innerHTML = "";

      Object.entries(CATEGORIES).forEach(([cat, subs]) => {
        // Directory Column
        const group = document.createElement("div");
        group.className = "category-group";

        const h3 = document.createElement("h3");
        h3.className = "category-heading";
        h3.textContent = cat;
        h3.addEventListener("click", () => {
          activeCategory = cat;
          activeSubcategory = null;
          showFavsOnly = false;
          renderListings();
        });
        group.appendChild(h3);

        const ul = document.createElement("ul");
        ul.className = "subcategory-list";
        subs.forEach((sub) => {
          const li = document.createElement("li");
          const btn = document.createElement("button");
          btn.textContent = sub;
          btn.addEventListener("click", () => {
            activeCategory = cat;
            activeSubcategory = sub;
            showFavsOnly = false;
            renderListings();
          });
          li.appendChild(btn);
          ul.appendChild(li);
        });
        group.appendChild(ul);
        grid.appendChild(group);

        // Create Post Select Optgroup
        const optgroup = document.createElement("optgroup");
        optgroup.label = cat;
        subs.forEach((sub) => {
          const opt = document.createElement("option");
          opt.value = `${cat}::${sub}`;
          opt.textContent = sub;
          optgroup.appendChild(opt);
        });
        select.appendChild(optgroup);
      });
    }

    // ==========================================
    // 6. AUTH & PASSWORD RESET HANDLING
    // ==========================================
    function updateAuthUI() {
      const authBtn = document.getElementById("openAuthBtn");
      const inboxBtn = document.getElementById("openInboxBtn");
      const adminBtn = document.getElementById("openAdminBtn");

      if (currentUser) {
        authBtn.textContent = "Log out";
        inboxBtn.style.display = "inline-block";
        const isAdmin = ADMIN_EMAILS.includes((currentUser.email || "").toLowerCase());
        adminBtn.style.display = isAdmin ? "inline-block" : "none";
        document.getElementById("feedbackEmail").value = currentUser.email || "";
      } else {
        authBtn.textContent = "Log in";
        inboxBtn.style.display = "none";
        adminBtn.style.display = "none";
      }
    }

    sb.auth.onAuthStateChange((event, session) => {
      currentUser = session?.user || null;
      updateAuthUI();

      // Handle password recovery redirect link
      if (event === "PASSWORD_RECOVERY") {
        document.getElementById("authModalTitle").textContent = "Set New Password";
        document.getElementById("authForm").style.display = "none";
        document.getElementById("resetPasswordForm").style.display = "block";
        clearStatus("resetStatus");
        openModal("authModal");
      }
    });

    document.getElementById("openAuthBtn").addEventListener("click", async () => {
      if (currentUser) {
        await sb.auth.signOut();
        return;
      }
      authMode = "login";
      syncAuthFormMode();
      document.getElementById("authForm").style.display = "block";
      document.getElementById("resetPasswordForm").style.display = "none";
      clearStatus("authStatus");
      openModal("authModal");
    });

    function syncAuthFormMode() {
      document.getElementById("authModalTitle").textContent =
        authMode === "login" ? "Log in to simplylists" : "Create a simplylists account";
      document.getElementById("authSubmitBtn").textContent =
        authMode === "login" ? "Log in" : "Sign up";
      document.getElementById("toggleAuthModeBtn").textContent =
        authMode === "login" ? "Need an account? Sign up" : "Already have an account? Log in";
    }

    document.getElementById("toggleAuthModeBtn").addEventListener("click", () => {
      authMode = authMode === "login" ? "signup" : "login";
      syncAuthFormMode();
      clearStatus("authStatus");
    });

    document.getElementById("authForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("authEmail").value.trim();
      const password = document.getElementById("authPassword").value;
      clearStatus("authStatus");

      const { error } =
        authMode === "login"
          ? await sb.auth.signInWithPassword({ email, password })
          : await sb.auth.signUp({ email, password });

      if (error) {
        setStatus("authStatus", error.message, "error");
      } else if (authMode === "signup") {
        setStatus("authStatus", "Check your email to confirm your account.", "success");
      } else {
        closeModal("authModal");
      }
    });

    document.getElementById("forgotPasswordBtn").addEventListener("click", async () => {
      const email = document.getElementById("authEmail").value.trim();
      if (!email) {
        setStatus("authStatus", "Enter your email address above first.", "error");
        return;
      }
      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin
      });
      if (error) {
        setStatus("authStatus", error.message, "error");
      } else {
        setStatus("authStatus", "Password reset link sent to your email.", "success");
      }
    });

    document.getElementById("resetPasswordForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById("newPasswordInput").value;
      const { error } = await sb.auth.updateUser({ password: newPassword });
      if (error) {
        setStatus("resetStatus", error.message, "error");
      } else {
        setStatus("resetStatus", "Password updated successfully.", "success");
        setTimeout(() => closeModal("authModal"), 1200);
      }
    });

    // ==========================================
    // 7. FETCH & RENDER LISTINGS + CAROUSEL
    // ==========================================
    async function loadListings() {
      const nowIso = new Date().toISOString();
      const { data, error } = await sb
        .from("posts")
        .select("*")
        .or(`expires_at.is.null,expires_at.gt.${nowIso}`)
        .order("created_at", { ascending: false });

      if (error) {
        document.getElementById("listingsContainer").innerHTML =
          `<div class="empty-state">Unable to load listings: ${escapeHtml(error.message)}</div>`;
        return;
      }

      allListings = data || [];
      renderFeaturedCarousel();
      renderListings();
    }

    function renderFeaturedCarousel() {
      const section = document.getElementById("featuredSection");
      const track = document.getElementById("featuredCarousel");
      const withPhotos = allListings
        .filter((p) => p.image_url)
        .sort((a, b) => (b.clicks || 0) - (a.clicks || 0))
        .slice(0, 10);

      if (!withPhotos.length) {
        section.style.display = "none";
        return;
      }

      section.style.display = "block";
      track.innerHTML = withPhotos
        .map(
          (p) => `
        <div class="carousel-card" data-id="${p.id}">
          <img src="${escapeHtml(p.image_url)}" alt="${escapeHtml(p.title)}" loading="lazy" />
          <div class="carousel-card-body">
            <div class="carousel-card-title">${escapeHtml(p.title)}</div>
            <div class="carousel-card-price">${p.price != null ? "$" + p.price : escapeHtml(p.subcategory || p.category)}</div>
          </div>
        </div>`
        )
        .join("");

      track.querySelectorAll(".carousel-card").forEach((card) => {
        card.addEventListener("click", () => openListingDetail(card.dataset.id));
      });
    }

    function renderListings() {
      const container = document.getElementById("listingsContainer");
      const heading = document.getElementById("feedHeading");
      const clearBtn = document.getElementById("clearFiltersBtn");

      let filtered = allListings.slice();
      if (showFavsOnly) {
        filtered = filtered.filter((p) => favoriteIds.has(String(p.id)));
        heading.textContent = "Saved Favorites";
      } else if (activeSubcategory) {
        filtered = filtered.filter(
          (p) => p.category === activeCategory && p.subcategory === activeSubcategory
        );
        heading.textContent = `${activeCategory} › ${activeSubcategory}`;
      } else if (activeCategory) {
        filtered = filtered.filter((p) => p.category === activeCategory);
        heading.textContent = activeCategory;
      } else {
        heading.textContent = searchQuery ? `Search: "${searchQuery}"` : "All Recent Listings";
      }

      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        filtered = filtered.filter(
          (p) =>
            (p.title || "").toLowerCase().includes(q) ||
            (p.description || "").toLowerCase().includes(q) ||
            (p.location || "").toLowerCase().includes(q)
        );
      }

      const hasFilters = Boolean(activeCategory || activeSubcategory || showFavsOnly || searchQuery);
      clearBtn.style.display = hasFilters ? "inline-block" : "none";

      if (!filtered.length) {
        container.innerHTML = `<div class="empty-state">No listings found matching your selection.</div>`;
        return;
      }

      const fallbackSvg =
        "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 60'%3E%3Crect width='80' height='60' fill='%23f3f4f6'/%3E%3Ctext x='50%25' y='54%25' font-family='sans-serif' font-size='10' fill='%239ca3af' text-anchor='middle'%3ENo photo%3C/text%3E%3C/svg%3E";

      container.innerHTML = filtered
        .map((p) => {
          const isFav = favoriteIds.has(String(p.id));
          const dateStr = p.created_at ? new Date(p.created_at).toLocaleDateString() : "";
          return `
          <article class="listing-row">
            <img class="listing-thumb" src="${escapeHtml(p.image_url || fallbackSvg)}" alt="" data-open="${p.id}" loading="lazy" />
            <div class="listing-content" data-open="${p.id}">
              <h3 class="listing-heading">${escapeHtml(p.title)}</h3>
              <div class="listing-meta">
                ${p.price != null ? `<span class="listing-price">$${p.price}</span>` : ""}
                <span>${escapeHtml(p.location || "")}</span>
                <span class="listing-badge">${escapeHtml(p.subcategory || p.category || "")}</span>
                <span>${dateStr}</span>
              </div>
            </div>
            <button class="fav-btn ${isFav ? "active" : ""}" data-fav="${p.id}" aria-label="Save favorite">
              ${isFav ? "♥" : "♡"}
            </button>
          </article>`;
        })
        .join("");

      container.querySelectorAll("[data-open]").forEach((el) => {
        el.addEventListener("click", () => openListingDetail(el.dataset.open));
      });

      container.querySelectorAll("[data-fav]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const id = String(btn.dataset.fav);
          if (favoriteIds.has(id)) favoriteIds.delete(id);
          else favoriteIds.add(id);
          localStorage.setItem("sl_favs", JSON.stringify([...favoriteIds]));
          renderListings();
        });
      });
    }

    // Search & Filter Controls
    document.getElementById("searchForm").addEventListener("submit", (e) => {
      e.preventDefault();
      searchQuery = document.getElementById("searchInput").value.trim();
      renderListings();
    });

    document.getElementById("toggleFavsBtn").addEventListener("click", () => {
      showFavsOnly = !showFavsOnly;
      renderListings();
    });

    function resetAllFilters() {
      activeCategory = null;
      activeSubcategory = null;
      showFavsOnly = false;
      searchQuery = "";
      document.getElementById("searchInput").value = "";
      renderListings();
    }

    document.getElementById("clearFiltersBtn").addEventListener("click", resetAllFilters);
    document.getElementById("homeResetBtn").addEventListener("click", resetAllFilters);

    // ==========================================
    // 8. CREATE POST & DIRECT PHOTO UPLOAD
    // ==========================================
    document.getElementById("openPostModalBtn").addEventListener("click", () => {
      if (!currentUser) {
        openModal("authModal");
        setStatus("authStatus", "Please log in to publish a listing.", "error");
        return;
      }
      clearStatus("postStatus");
      openModal("postModal");
    });

    document.getElementById("createPostForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!currentUser) return;
      clearStatus("postStatus");

      const title = document.getElementById("postTitle").value.trim();
      const [category, subcategory] = document.getElementById("postCategory").value.split("::");
      const priceVal = document.getElementById("postPrice").value;
      const location = document.getElementById("postLocation").value.trim();
      const durationDays = parseInt(document.getElementById("postDuration").value, 10);
      const description = document.getElementById("postDescription").value.trim();
      const file = document.getElementById("postPhoto").files[0];

      let imageUrl = null;
      if (file) {
        const ext = file.name.split(".").pop();
        const filePath = `${currentUser.id}/${Date.now()}.${ext}`;
        const { error: uploadErr } = await sb.storage.from(PHOTO_BUCKET).upload(filePath, file);
        if (uploadErr) {
          setStatus("postStatus", `Photo upload failed: ${uploadErr.message}`, "error");
          return;
        }
        const { data: pubData } = sb.storage.from(PHOTO_BUCKET).getPublicUrl(filePath);
        imageUrl = pubData.publicUrl;
      }

      const expiresAt = new Date(Date.now() + durationDays * 86400000).toISOString();

      const { error } = await sb.from("posts").insert({
        user_id: currentUser.id,
        title,
        category,
        subcategory,
        price: priceVal === "" ? null : Number(priceVal),
        location,
        description,
        image_url: imageUrl,
        expires_at: expiresAt
      });

      if (error) {
        setStatus("postStatus", error.message, "error");
      } else {
        document.getElementById("createPostForm").reset();
        closeModal("postModal");
        loadListings();
      }
    });

    // ==========================================
    // 9. LISTING DETAIL, CLICKS, MESSAGING, FLAGGING
    // ==========================================
    async function openListingDetail(id) {
      const post = allListings.find((p) => String(p.id) === String(id));
      if (!post) return;
      activeListing = post;

      document.getElementById("detailTitle").textContent = post.title;
      document.getElementById("detailDescription").textContent = post.description || "";
      const photoEl = document.getElementById("detailPhoto");
      if (post.image_url) {
        photoEl.src = post.image_url;
        photoEl.style.display = "block";
      } else {
        photoEl.style.display = "none";
      }

      document.getElementById("detailMeta").innerHTML = `
        ${post.price != null ? `<span class="listing-price">$${post.price}</span>` : ""}
        <span>${escapeHtml(post.location || "")}</span>
        <span class="listing-badge">${escapeHtml(post.category)} › ${escapeHtml(post.subcategory || "")}</span>
        ${post.expires_at ? `<span>Expires ${new Date(post.expires_at).toLocaleDateString()}</span>` : ""}
      `;

      clearStatus("messageStatus");
      document.getElementById("messageContent").value = "";
      openModal("detailModal");

      // Increment click count for weekly featured carousel
      sb.from("posts")
        .update({ clicks: (post.clicks || 0) + 1 })
        .eq("id", post.id)
        .then(() => {
          post.clicks = (post.clicks || 0) + 1;
        });
    }

    document.getElementById("messageForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!currentUser) {
        setStatus("messageStatus", "Please log in to send a message.", "error");
        return;
      }
      if (!activeListing) return;

      const content = document.getElementById("messageContent").value.trim();
      const { error } = await sb.from("messages").insert({
        post_id: activeListing.id,
        sender_id: currentUser.id,
        receiver_id: activeListing.user_id,
        content,
        source: "web"
      });

      if (error) {
        setStatus("messageStatus", error.message, "error");
      } else {
        document.getElementById("messageContent").value = "";
        setStatus("messageStatus", "Message sent!", "success");
      }
    });

    document.getElementById("flagListingBtn").addEventListener("click", async () => {
      if (!activeListing) return;
      const { error } = await sb
        .from("posts")
        .update({ is_flagged: true })
        .eq("id", activeListing.id);
      if (error) {
        setStatus("messageStatus", error.message, "error");
      } else {
        setStatus("messageStatus", "Listing flagged for moderation review.", "success");
      }
    });

    // ==========================================
    // 10. INBOX
    // ==========================================
    document.getElementById("openInboxBtn").addEventListener("click", async () => {
      if (!currentUser) return;
      openModal("inboxModal");
      const listEl = document.getElementById("inboxList");
      listEl.innerHTML = `<div class="empty-state">Loading messages...</div>`;

      const { data, error } = await sb
        .from("messages")
        .select("id, content, created_at, sender_id, receiver_id, posts(title)")
        .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`)
        .order("created_at", { ascending: false });

      if (error || !data?.length) {
        listEl.innerHTML = `<div class="empty-state">${error ? escapeHtml(error.message) : "No messages yet."}</div>`;
        return;
      }

      listEl.innerHTML = data
        .map((m) => {
          const isMine = m.sender_id === currentUser.id;
          return `
          <div class="admin-item">
            <div>
              <div style="font-size:0.82rem; color:var(--muted); margin-bottom:2px;">
                <strong>${isMine ? "Sent" : "Received"}</strong> · ${escapeHtml(m.posts?.title || "Listing")} · ${new Date(m.created_at).toLocaleString()}
              </div>
              <div style="font-size:0.92rem;">${escapeHtml(m.content)}</div>
            </div>
          </div>`;
        })
        .join("");
    });

    // ==========================================
    // 11. FEEDBACK SUBMISSION (Matches email column)
    // ==========================================
    document.getElementById("openFeedbackBtn").addEventListener("click", () => {
      clearStatus("feedbackStatus");
      openModal("feedbackModal");
    });

    document.getElementById("feedbackForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearStatus("feedbackStatus");

      const email = document.getElementById("feedbackEmail").value.trim();
      const message = document.getElementById("feedbackMessage").value.trim();

      const { error } = await sb.from("feedback").insert({
        email,
        message
      });

      if (error) {
        setStatus("feedbackStatus", error.message, "error");
      } else {
        document.getElementById("feedbackForm").reset();
        setStatus("feedbackStatus", "Thank you! Your feedback has been submitted.", "success");
      }
    });

    // ==========================================
    // 12. 4-TAB ADMIN MODERATION CENTER
    // ==========================================
    let currentAdminTab = "listings";

    document.getElementById("openAdminBtn").addEventListener("click", () => {
      openModal("adminModal");
      loadAdminTab(currentAdminTab);
    });

    document.querySelectorAll(".admin-tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".admin-tab").forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        currentAdminTab = tab.dataset.adminTab;
        loadAdminTab(currentAdminTab);
      });
    });

    async function loadAdminTab(tab) {
      const container = document.getElementById("adminContent");
      container.innerHTML = `<div class="empty-state">Loading ${tab}...</div>`;

      if (tab === "listings" || tab === "flagged") {
        let query = sb.from("posts").select("*").order("created_at", { ascending: false }).limit(50);
        if (tab === "flagged") query = query.eq("is_flagged", true);
        const { data, error } = await query;

        if (error || !data?.length) {
          container.innerHTML = `<div class="empty-state">${error ? escapeHtml(error.message) : "No items found."}</div>`;
          return;
        }

        container.innerHTML = data
          .map(
            (p) => `
          <div class="admin-item">
            <div>
              <strong>${escapeHtml(p.title)}</strong>
              <div style="font-size:0.8rem; color:var(--muted);">${escapeHtml(p.category)} › ${escapeHtml(p.subcategory || "")} · ${escapeHtml(p.location || "")}</div>
            </div>
            <button class="btn btn-danger" data-del-post="${p.id}">Delete</button>
          </div>`
          )
          .join("");

        container.querySelectorAll("[data-del-post]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            await sb.from("posts").delete().eq("id", btn.dataset.delPost);
            loadAdminTab(tab);
            loadListings();
          });
        });
      } else if (tab === "messages") {
        const { data, error } = await sb
          .from("messages")
          .select("id, content, created_at, posts(title)")
          .order("created_at", { ascending: false })
          .limit(50);

        if (error || !data?.length) {
          container.innerHTML = `<div class="empty-state">${error ? escapeHtml(error.message) : "No messages found."}</div>`;
          return;
        }

        container.innerHTML = data
          .map(
            (m) => `
          <div class="admin-item">
            <div>
              <div style="font-size:0.8rem; color:var(--muted);">${escapeHtml(m.posts?.title || "Listing")} · ${new Date(m.created_at).toLocaleString()}</div>
              <div>${escapeHtml(m.content)}</div>
            </div>
          </div>`
          )
          .join("");
      } else if (tab === "feedback") {
        const { data, error } = await sb
          .from("feedback")
          .select("*")
          .order("created_at", { ascending: false })
          .limit(50);

        if (error || !data?.length) {
          container.innerHTML = `<div class="empty-state">${error ? escapeHtml(error.message) : "No feedback submitted yet."}</div>`;
          return;
        }

        container.innerHTML = data
          .map(
            (f) => `
          <div class="admin-item">
            <div>
              <div style="font-size:0.82rem; color:var(--muted);"><strong>${escapeHtml(f.email || "Anonymous")}</strong> · ${new Date(f.created_at).toLocaleString()}</div>
              <div style="margin-top:4px;">${escapeHtml(f.message)}</div>
            </div>
          </div>`
          )
          .join("");
      }
    }

    // Footer Info Modals
    document.querySelectorAll("[data-info]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const info = FOOTER_CONTENT[btn.dataset.info];
        if (!info) return;
        document.getElementById("infoModalTitle").textContent = info.title;
        document.getElementById("infoModalBody").textContent = info.body;
        openModal("infoModal");
      });
    });

    // Boot
    renderCategories();
    loadListings();
  </script>
</body>
</html>
